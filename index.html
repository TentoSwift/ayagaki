<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>綾書エディタ — 二枚安田組</title>
<style>
  :root {
    --bg: #f5f2e8;
    --panel: #ffffff;
    --border: #d8d2c0;
    --text: #3a352a;
    --accent: #7a6a4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 14px;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 10px 16px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: #8a8270; font-size: 12px; }
  .layout {
    display: grid; grid-template-columns: minmax(380px, auto) 1fr;
    gap: 16px; padding: 16px; align-items: start;
  }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

  .gridPane {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; overflow: auto; max-height: calc(100vh - 90px);
  }
  .sidePane { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 16px; }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px;
  }
  .card h2 { font-size: 14px; margin: 0 0 10px; color: var(--accent); }

  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .row label { font-size: 13px; }
  select, input[type="number"], input[type="text"] {
    font-size: 13px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 5px;
    background: #fff; color: var(--text);
  }
  input[type="number"] { width: 64px; }
  button {
    font-size: 13px; padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: #fff; color: var(--text); cursor: pointer;
  }
  button:hover { background: #f3efe4; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { background: #695a3d; }

  .palette { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 5px 7px; border: 2px solid transparent; border-radius: 8px; cursor: pointer;
    user-select: none; -webkit-user-select: none;
  }
  .swatch.selected { border-color: var(--accent); background: #f3efe4; }
  .swatch input[type="color"] {
    width: 34px; height: 28px; border: 1px solid var(--border); border-radius: 5px;
    padding: 0; background: none; cursor: pointer;
  }
  .swatch span { font-size: 11px; }

  svg.grid { display: block; touch-action: none; }
  svg.grid .cell { cursor: crosshair; }
  svg.grid .cell.rowHi { stroke: #e0392b; stroke-width: 1.6; }
  svg.grid text.num { font-size: 9px; fill: #9a927e; user-select: none; }

  .notation { max-height: 320px; overflow: auto; }
  table.nota { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.nota th, table.nota td { border: 1px solid #e4dfcf; padding: 3px 6px; text-align: left; }
  table.nota th { background: #f3efe4; font-weight: 600; }
  table.nota td.seg { white-space: nowrap; color: var(--accent); font-weight: 600; }
  table.nota tr:hover td { background: #fbf8ee; }

  .previewWrap { overflow: auto; max-height: 340px; text-align: center; }

  .hint { font-size: 11.5px; color: #8a8270; line-height: 1.6; margin-top: 8px; }

  .fileRow input[type="file"] { display: none; }

  /* ===== 印刷 ===== */
  @media print {
    header, .sidePane .card.controlsCard, .noprint { display: none !important; }
    body { background: #fff; }
    .layout { display: block; padding: 0; }
    .gridPane { max-height: none; overflow: visible; border: none; }
    .sidePane { position: static; }
    .card { border: none; page-break-inside: avoid; }
    .notation { max-height: none; overflow: visible; }
    .previewWrap { max-height: none; overflow: visible; }
    .printTitle { display: block !important; font-size: 16px; font-weight: bold; margin: 0 0 8px; }
  }
  .printTitle { display: none; }
</style>
</head>
<body>
<header>
  <h1>綾書エディタ</h1>
  <span class="sub">二枚安田組（60〜100玉）— 模様を塗ると交換記号を自動生成します</span>
</header>

<div class="layout">
  <div class="gridPane">
    <div class="printTitle" id="printTitle"></div>
    <svg class="grid" id="gridSvg"></svg>
  </div>

  <div class="sidePane">
    <div class="card controlsCard">
      <h2>設定・道具</h2>
      <div class="row">
        <label>玉数
          <select id="tamaSel">
            <option value="60">60玉（片面13目）</option>
            <option value="68">68玉（片面15目）</option>
            <option value="76">76玉（片面17目）</option>
            <option value="84">84玉（片面19目）</option>
            <option value="92">92玉（片面21目）</option>
            <option value="100">100玉（片面23目）</option>
          </select>
        </label>
        <label>段数 <input type="number" id="rowsInp" min="4" max="120" value="40"></label>
        <label><input type="checkbox" id="symChk"> 左右対称に塗る</label>
      </div>
      <div class="row">
        <span>色：</span>
        <div class="palette" id="palette"></div>
      </div>
      <div class="row">
        <button id="undoBtn">↩︎ 元に戻す</button>
        <button id="clearBtn">全消去</button>
      </div>
      <div class="row fileRow">
        <input type="text" id="nameInp" placeholder="デザイン名" style="width: 140px">
        <button id="saveBtn" class="primary">保存</button>
        <select id="loadSel"><option value="">保存済みを開く…</option></select>
        <button id="delBtn">削除</button>
      </div>
      <div class="row fileRow">
        <button id="exportBtn">JSON書き出し</button>
        <button id="importBtn">JSON読み込み</button>
        <input type="file" id="importFile" accept=".json,application/json">
        <button id="printBtn">印刷 / PDF</button>
      </div>
      <div class="hint">
        マスをタップ / ドラッグで塗ります（「地」で消去）。<br>
        記号の意味 — <b>綾名</b>：ナミ／上a下b…（合計6）の手取り／<b>先頭の数字</b>：糸交換（上下段の糸を入れかえる位置）／<b>丸数字</b>：入れかえて元の色に戻す。<br>
        数えるのは入れかえの目（1目おき・片面目数の半分。60玉＝6目）のみ。⬆（中央で上ル）は中央の色（d=0）から自動で導出されます（記号表は読み取り専用）。
      </div>
    </div>

    <div class="card">
      <h2>交換記号（自動生成）</h2>
      <div class="notation" id="notation"></div>
    </div>

    <div class="card">
      <h2>仕上がりプレビュー（2リピート）</h2>
      <div class="previewWrap"><svg id="previewSvg"></svg></div>
    </div>
  </div>
</div>

<script>
"use strict";

/* ===== 状態 ===== */
// 綾書定規（書籍 4-10/4-11）の目盛り。60玉=13目 を基点に 8玉ごとに +2目
const TAMA_TO_COLS = { 60: 13, 68: 15, 76: 17, 84: 19, 92: 21, 100: 23 };
const CELL = 10;               // 菱形の半径（横=縦、45°）
const MARGIN = 8;
const NUM_W = 26;              // 段番号の帯幅
const LS_AUTOSAVE = "ayagaki-autosave";
const LS_DESIGNS = "ayagaki-designs";

let app = {
  tama: 60,
  rows: 40,
  palette: ["#dfe6c4", "#a2653a", "#3f5da8", "#c8b23c"],
  paletteNames: ["地", "柄", "柄2", "柄3"],  // 柄色は1つ（UI は先頭2色のみ表示）
  cur: 1,
  sym: false,
  name: "",
  cells: null,   // { L: rows×N, R: rows×N }  値 = パレット番号（0=地）
};

function cols() { return TAMA_TO_COLS[app.tama]; }

function emptyCells(rows, n) {
  const mk = () => Array.from({ length: rows }, () => new Array(n).fill(0));
  // C: 各段2目（index 2r=右半面の段r+1の上ル目、2r+1=左半面）。塗るとその段に ⬆ が付く
  return { L: mk(), R: mk(), C: new Array(rows * 2).fill(0) };
}

function resizeCells(old, rows, n) {
  const nc = emptyCells(rows, n);
  if (old) {
    for (const s of ["L", "R"]) {
      for (let r = 0; r < Math.min(rows, old[s].length); r++) {
        for (let d = 0; d < Math.min(n, old[s][r].length); d++) nc[s][r][d] = old[s][r][d];
      }
    }
    if (old.C) {
      if (old.C.length === old.L.length) {
        // 旧形式（段ごとに1目）→ 両方の目に展開
        for (let r = 0; r < Math.min(rows, old.C.length); r++) { nc.C[2*r] = old.C[r]; nc.C[2*r+1] = old.C[r]; }
      } else {
        for (let j = 0; j < Math.min(rows * 2, old.C.length); j++) nc.C[j] = old.C[j];
      }
    }
  }
  return nc;
}

/* ===== 幾何 =====
   d = 中央からの距離（0 = 中央寄り, N-1 = 外端）
   各段は中央が最も低い「∨」型（高台の組み口の形） */
function geo() {
  const N = cols();
  const cx = MARGIN + NUM_W + (N + 1) * CELL;
  const y0 = MARGIN + N * CELL;
  const w = (2 * N + 1) * CELL + 2 * (MARGIN + NUM_W);
  const h = y0 + (app.rows - 1) * 2 * CELL + 2 * CELL + MARGIN;
  return { N, cx, y0, w, h };
}

function cellCenter(g, side, r, d) {
  // 右半面は d=0 が中央線上。右段が先に始まり、左半面が1目（CELL）下がって連続タイルになる
  if (side === "R") return { x: g.cx + d * CELL, y: g.y0 + r * 2 * CELL - d * CELL };
  return { x: g.cx - (1 + d) * CELL, y: g.y0 + r * 2 * CELL - d * CELL + CELL };
}

function diamondPoints(x, y) {
  return `${x},${y - CELL} ${x + CELL},${y} ${x},${y + CELL} ${x - CELL},${y}`;
}

/* 目の「糸の帯」の向き。true = ／（右上がり）、false = ＼。
   目の中心は ／方向(CELL,-CELL) と ＼方向(CELL,CELL) の格子に乗る。市松（隣り合う目で必ず入れかわる）
   にするための偶奇は右半面で d、左半面で d+1（Swift の GridGeometry.isSlash と同式） */
function isSlash(side, r, d) {
  const par = d % 2 === 0;
  return side === "L" ? !par : par;
}

/* 45°に傾いたカプセル（丸角長方形）の糸の一片。長さ 2*CELL*0.9・幅 CELL*0.9・角丸 = 幅/2 */
const BAND_LEN = 2 * CELL * 0.9, BAND_WID = CELL * 0.9;
function bandAttrs(el, x, y, slash) {
  el.setAttribute("x", -BAND_LEN / 2);
  el.setAttribute("y", -BAND_WID / 2);
  el.setAttribute("width", BAND_LEN);
  el.setAttribute("height", BAND_WID);
  el.setAttribute("rx", BAND_WID / 2);
  el.setAttribute("ry", BAND_WID / 2);
  el.setAttribute("transform", `translate(${x},${y}) rotate(${slash ? -45 : 45})`);
}

/* ===== グリッド描画 ===== */
const gridSvg = document.getElementById("gridSvg");
let cellIndex = {};  // "side-r-d" -> polygon要素

function renderGrid() {
  const g = geo();
  gridSvg.setAttribute("viewBox", `0 0 ${g.w} ${g.h}`);
  gridSvg.setAttribute("width", g.w);
  gridSvg.setAttribute("height", g.h);
  gridSvg.innerHTML = "";
  cellIndex = {};
  const frag = document.createDocumentFragment();
  const hits = [];
  const NS = "http://www.w3.org/2000/svg";

  for (let r = 0; r < app.rows; r++) {
    for (const side of ["L", "R"]) {
      for (let d = 0; d < g.N; d++) {
        const c = cellCenter(g, side, r, d);
        const p = document.createElementNS(NS, "rect");
        bandAttrs(p, c.x, c.y, isSlash(side, r, d));
        p.setAttribute("class", "cell");
        p.setAttribute("stroke", "#4a4330");
        p.setAttribute("stroke-width", "0.6");
        p.dataset.side = side; p.dataset.r = r; p.dataset.d = d;
        p.setAttribute("fill", app.palette[app.cells[side][r][d]] || app.palette[0]);
        cellIndex[`${side}-${r}-${d}`] = p;
        frag.appendChild(p);
        // 帯は菱形より細いので、タップ判定用に透明な菱形を最前面に重ねる
        const hit = document.createElementNS(NS, "polygon");
        hit.setAttribute("points", diamondPoints(c.x, c.y));
        hit.setAttribute("class", "cell");
        hit.setAttribute("fill", "transparent");
        hit.dataset.side = side; hit.dataset.r = r; hit.dataset.d = d;
        hits.push(hit);
      }
    }
    // 段番号（両端。右半面は1目ずれる）
    const outerL = cellCenter(g, "L", r, g.N - 1);
    const outerR = cellCenter(g, "R", r, g.N - 1);
    for (const [x, anchor, y] of [[MARGIN + NUM_W - 6, "end", outerL.y], [g.w - MARGIN - NUM_W + 6, "start", outerR.y]]) {
      const t = document.createElementNS(NS, "text");
      t.setAttribute("x", x); t.setAttribute("y", y + 3);
      t.setAttribute("text-anchor", anchor);
      t.setAttribute("class", "num");
      t.textContent = r + 1;
      frag.appendChild(t);
    }
  }
  // 中央のジグザグ（d=0 の目の中心を上から順に左右交互に結ぶ。右段が先に始まる）
  const zz = [];
  for (let r = 0; r < app.rows; r++) {
    for (const side of ["R", "L"]) {
      const c = cellCenter(g, side, r, 0);
      zz.push(`${c.x},${c.y}`);
    }
  }
  const zig = document.createElementNS(NS, "polyline");
  zig.setAttribute("points", zz.join(" "));
  zig.setAttribute("fill", "none");
  zig.setAttribute("stroke", "#4a4330");
  zig.setAttribute("stroke-width", "1.2");
  zig.setAttribute("stroke-linejoin", "round");
  zig.setAttribute("pointer-events", "none");
  frag.appendChild(zig);
  for (const h of hits) frag.appendChild(h);
  gridSvg.appendChild(frag);
}

function cellValue(side, r, d) {
  return side === "C" ? app.cells.C[r] : app.cells[side][r][d];
}
function updateCellFill(side, r, d) {
  const p = cellIndex[`${side}-${r}-${d}`];
  if (p) p.setAttribute("fill", app.palette[cellValue(side, r, d)] || app.palette[0]);
}

/* ===== 塗り操作 ===== */
let painting = false;
let undoStack = [];

function pushUndo() {
  undoStack.push(JSON.stringify(app.cells));
  if (undoStack.length > 100) undoStack.shift();
}

function syncArrowFromCenterColor(side, r) {
  // 左の中央列の色 → 右半面の ⬆（C[2r]）、右 → 左半面（1段前の C[2(r-1)+1]）
  const j = side === "L" ? 2 * r : 2 * (r - 1) + 1;
  if (j >= 0 && j < app.cells.C.length) app.cells.C[j] = (app.cells[side][r][0] || 0) > 0 ? 1 : 0;
}
function paintCell(side, r, d) {
  const v = app.cur;
  let changed = false;
  if (side === "C") {
    if (app.cells.C[r] !== v) { app.cells.C[r] = v; changed = true; }
  } else {
    if (app.cells[side][r][d] !== v) {
      app.cells[side][r][d] = v; updateCellFill(side, r, d); changed = true;
      if (d === 0) syncArrowFromCenterColor(side, r);
    }
    if (app.sym) {
      const other = side === "L" ? "R" : "L";
      if (app.cells[other][r][d] !== v) {
        app.cells[other][r][d] = v; updateCellFill(other, r, d); changed = true;
        if (d === 0) syncArrowFromCenterColor(other, r);
      }
    }
  }
  if (changed) scheduleDerived();
}

function cellFromEvent(e) {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if (el && el.classList && el.classList.contains("cell")) {
    return { side: el.dataset.side, r: +el.dataset.r, d: +el.dataset.d };
  }
  return null;
}

gridSvg.addEventListener("pointerdown", (e) => {
  const c = cellFromEvent(e);
  if (!c) return;
  e.preventDefault();
  pushUndo();
  painting = true;
  gridSvg.setPointerCapture(e.pointerId);
  paintCell(c.side, c.r, c.d);
});
gridSvg.addEventListener("pointermove", (e) => {
  if (!painting) return;
  const c = cellFromEvent(e);
  if (c) paintCell(c.side, c.r, c.d);
});
const stopPaint = () => { if (painting) { painting = false; scheduleAutosave(); } };
gridSvg.addEventListener("pointerup", stopPaint);
gridSvg.addEventListener("pointercancel", stopPaint);

/* ===== パレットUI ===== */
const paletteDiv = document.getElementById("palette");
function renderPalette() {
  // 地の色に対して柄色は1つ（二枚安田組の制約）。配列は保存データ互換のため4色のまま
  if (app.cur > 1) app.cur = 1;
  paletteDiv.innerHTML = "";
  app.palette.slice(0, 2).forEach((color, i) => {
    const sw = document.createElement("div");
    sw.className = "swatch" + (app.cur === i ? " selected" : "");
    const inp = document.createElement("input");
    inp.type = "color"; inp.value = color;
    inp.addEventListener("input", () => {
      app.palette[i] = inp.value;
      repaintAll(); scheduleDerived(); scheduleAutosave();
    });
    inp.addEventListener("click", (e) => { app.cur = i; renderPalette(); e.stopPropagation(); });
    const label = document.createElement("span");
    label.textContent = i === 0 ? "地（消す）" : app.paletteNames[i];
    sw.appendChild(inp); sw.appendChild(label);
    sw.addEventListener("click", () => { app.cur = i; renderPalette(); });
    paletteDiv.appendChild(sw);
  });
}

function repaintAll() {
  for (const key in cellIndex) {
    const [side, r, d] = key.split("-");
    updateCellFill(side, +r, +d);
  }
}

/* ===== 交換記号の生成（書籍 4-13 / 4-15 の形式） =====
   1段＝[糸交換リスト]＋[綾名]。綾の読みは「入れかえの目」＝1目おき（偶数目盛り、60玉=6目）のみ。
   ・上の操作（綾の手取りで目を上げる）には戻しを付けない。戻しが要るのは糸交換のみ
   ・斜めに進んだ縞は、一番先の目の色が終わる段に、その場所の番号（d+1）で糸交換を書く（戻し不要）
   ・飛びの糸交換は+2の番号で、模様の終わりの1段先で戻す（2.3 → ④⑤）
   ・戻しの丸数字は終わった段の直後ではなく、ひとつ段を飛ばした先に表示する
   ・中央の糸交換（⬆）は、それぞれの段の2段先に③で戻す（毎回同じ番号）
   ・偶数列（縦に進む列 d=2,4,…）は糸交換のみ: 色のある段に番号 d+1 を書き、2段先に+2の丸数字で戻す
   ・手取りの⬆のみ（中央の色なし）のブロックは書籍 4-15 の一括の戻し「②〜(M+2)ナミ」
   ・入れかえの目が一度に2目以上増える段 → 「2.3.」等の糸交換を前置（6個以上は「2〜M.」に圧縮）
   ・数字・丸数字と綾名の区切りはピリオド（ナミの前は区切りなし。書籍 4-16）
   ・±1目の漸進変化は綾の手取りだけで賄うため数字なし */
function circled(n) {
  // ①〜⑳（U+2460）＋㉑〜㉟（U+3251）で 100玉（片面23目）まで対応
  if (n >= 1 && n <= 20) return String.fromCharCode(0x2460 + n - 1);
  if (n >= 21 && n <= 35) return String.fromCharCode(0x3251 + n - 21);
  return `(${n})`;
}
function circledRange(from, to) {
  if (to < from) return "";
  if (to - from + 1 <= 3) {
    let s = "";
    for (let i = from; i <= to; i++) s += circled(i);
    return s;
  }
  return circled(from) + "〜" + circled(to);
}
function circledList(nums) {
  // 丸数字の列（昇順前提。連続なら範囲形式、不連続は並記）
  if (!nums.length) return "";
  const first = nums[0], last = nums[nums.length - 1];
  if (nums.length === last - first + 1) return circledRange(first, last);
  return nums.map(circled).join("");
}
function plainNumbers(nums) {
  // 糸交換の番号列（昇順前提）。全体が連続で6個以上なら「2〜11.」に範囲圧縮（書籍 4-16）、
  // それ以外は「3.5.7.」の並記。末尾のピリオドが綾名との区切り
  if (!nums.length) return "";
  const first = nums[0], last = nums[nums.length - 1];
  if (nums.length >= 6 && nums.length === last - first + 1) return `${first}〜${last}.`;
  return nums.join(".") + ".";
}
function numberList(circledNums, plainNums, beforeNami) {
  // 糸交換（数字）と戻し（丸数字）を1つの数列にする（手書きの綾書の書式）。
  // 数値順に並べ、通常数字の後にだけ「.」。同種のみなら従来の範囲圧縮を使う
  const cs = [...circledNums].sort((a, b) => a - b);
  const ps = [...plainNums].sort((a, b) => a - b);
  if (!cs.length && !ps.length) return "";
  if (!ps.length) {
    const s = circledList(cs);
    return beforeNami ? s : s + ".";
  }
  if (!cs.length) return plainNumbers(ps);
  const all = [...cs.map(n => [n, true]), ...ps.map(n => [n, false])]
    .sort((a, b) => a[0] === b[0] ? (b[1] ? 1 : 0) - (a[1] ? 1 : 0) : a[0] - b[0]);
  let out = "";
  for (const [n, isC] of all) out += isC ? circled(n) : n + ".";
  if (!out.endsWith(".") && !beforeNami) out += ".";
  return out;
}
function ayaName(slots) {
  // 綾名は全区間を「上a下b…」で数字付きで略さず書く（1も書く。合計は常に6）
  if (!slots.some(Boolean)) return "ナミ";
  const runs = [];
  for (const f of slots) {
    if (runs.length && runs[runs.length - 1].f === f) runs[runs.length - 1].n++;
    else runs.push({ f, n: 1 });
  }
  return runs.map(x => (x.f ? "上" : "下") + x.n).join("");
}
function sideTexts(side) {
  const N = cols();
  const idx = [];
  for (let d = 1; d < N; d += 2) idx.push(d);

  const texts = [];
  const opp = side === "R" ? "L" : "R";
  let opRun = 0;
  let prev = null;
  const blockPairs = new Set();  // ブロック内の飛びの糸交換で戻す番号（交換番号+2）
  let hadCenter = false;         // ブロックが中央の色による上ルを含むか
  let hadArrow = false;          // ブロックが手取りの⬆を含むか
  const sched = Array.from({ length: app.rows }, () => new Set());  // 各段で戻す対（先の段に予約）
  // 糸交換の連なりの追跡: 中央（d=0）または発火した偶数列の糸交換から45度
  // （±1目、1段おきの2段2目も含む）で続いてきた色は carried。
  // carried の偶数列は糸交換を書かない。綾（奇数列）から続いただけの偶数列は糸交換が要る
  const carried = Array.from({ length: app.rows }, () => new Array(N).fill(false));
  const fired = Array.from({ length: app.rows }, () => new Array(N).fill(false));
  for (let r0 = 0; r0 < app.rows; r0++) {
    for (let d0 = 0; d0 < N; d0++) {
      if (!(app.cells[side][r0][d0] > 0)) continue;
      const fromChain = (rr, dd) => rr >= 0 && dd >= 0 && dd < N && app.cells[side][rr][dd] > 0 &&
        (carried[rr][dd] || dd === 0 || (dd % 2 === 0 && fired[rr][dd]));
      // 連なりは外向き（1目外 or 1段おきの2目外）のみ。内向きの斜めは続きにしない
      carried[r0][d0] = fromChain(r0-1, d0-1) || fromChain(r0-2, d0-2);
      if (d0 >= 2 && d0 % 2 === 0 && !carried[r0][d0]) fired[r0][d0] = true;
    }
  }
  // 斜めに進んだ縞（入れかえの目を1目ずつ外へ移る色）の糸交換:
  // 一番先の目の色が終わる段に、その場所の番号（d+1）を書く。戻しは不要
  const tipNums = Array.from({ length: app.rows }, () => new Set());
  // 中央上ル: 反対側の d=0 の色。記号の法則は左右同一（⬆の表示位置だけ左が1段前 = C 側で対応）
  const riseAt = side === "L"
    ? (r => r >= 0 && r < app.rows && (app.cells.R[r][0] || 0) > 0)
    : (r => r >= 0 && r < app.rows && (app.cells.L[r][0] || 0) > 0);
  // 反対の半面の中央上ル（矢印の後の戻しは反対の面で行う）＝自面の d=0 の色
  const oppRiseAt = r => r >= 0 && r < app.rows && (app.cells[side][r][0] || 0) > 0;
  for (let d = 1; d < N; d += 2) {
    // 内側（d-2、d=1 は中央の上ル）に色があるか
    const innerAt = r => r >= 0 && r < app.rows &&
      (d >= 3 ? app.cells[side][r][d - 2] > 0 : riseAt(r));
    let runStart = null;
    for (let r = 0; r <= app.rows; r++) {
      const colored = r < app.rows && app.cells[side][r][d] > 0;
      if (colored && runStart === null) runStart = r;
      if (!colored && runStart !== null) {
        const a = runStart, b = r - 1;
        // 縞が内側から移ってきたか（直前の段か、1段おきの塗りなら2段前）
        const fromInner = innerAt(a - 1) || innerAt(a - 2);
        // 外側（d+2）へまだ続くか（1段おきの塗りも考慮して b+2 まで見る）
        let toOuter = false;
        if (d + 2 < N) {
          for (let rr = b; rr <= Math.min(b + 2, app.rows - 1); rr++) {
            if (app.cells[side][rr][d + 2] > 0) { toOuter = true; break; }
          }
        }
        // 内側が縞の始まる前から終端まで塗られたままなら、広がる模様（4-15型）なので出さない
        const widening = innerAt(a - 1) && innerAt(b);
        // 糸を変える操作（偶数列の糸交換）から45度で続いてきた色なら、
        // 地色に戻る所までの間に糸交換を書かない（戻しが受け持つ）
        let fromExchange = false;
        let rr = a, dd = d;
        while (true) {
          if (rr - 1 >= 0 && dd - 1 >= 0 && app.cells[side][rr-1][dd-1] > 0) { rr--; dd--; }
          else if (rr - 2 >= 0 && dd - 2 >= 0 && app.cells[side][rr-2][dd-2] > 0) { rr -= 2; dd -= 2; }
          else break;
          if (dd === 0) { fromExchange = true; break; }  // 中央の糸交換が起点
          if (dd % 2 === 0 && fired[rr][dd]) { fromExchange = true; break; }  // 途中の糸交換が起点
        }
        if (fromInner && !toOuter && !widening && !fromExchange) tipNums[b].add(Math.min(d + 1, N));
        runStart = null;
      }
    }
  }
  for (let r = 0; r < app.rows; r++) {
    // 綾名は入れかえの目（d 奇数）だけを読む。偶数列（縦に進む列）は糸交換のみ
    const slots = idx.map(d => app.cells[side][r][d] > 0);
    const risesAtCenter = riseAt(r);  // 中央の色による上ル（左半面は1段前）
    // 45度に色を辿る（1段1目外。1段おきの塗りは2段2目でも続きとみなす）。
    // 歩調は一貫させる: 1段1目で進んできた連なりは2段2目へ乗り換えない（逆も同じ）。
    // 終端の段と、色の数（ステップ数）を返す
    const trace45 = (r0, d0) => {
      let pr = r0, pd = d0, n = 0, pace = 0;  // pace: 0=未定, 1, 2
      while (true) {
        if (pace !== 2 && pr + 1 < app.rows && pd + 1 < N && (app.cells[side][pr+1][pd+1] || 0) > 0) { pr++; pd++; pace = 1; }
        else if (pace !== 1 && pr + 2 < app.rows && pd + 2 < N && (app.cells[side][pr+2][pd+2] || 0) > 0) { pr += 2; pd += 2; pace = 2; }
        else break;
        n++;
      }
      return [pr, pd, n];
    };
    // 矢印（中央上ル）の後の戻しは反対の面で行う。中央の色から45度に進んだ色が
    // 地色になる所の2段先に。番号は終端の位置の番号+2（end.d+3。中央単独=③、d2で終われば⑤）
    // 戻しは、45度の終端から先の「次の偶数列（交換できる目）」の段に、その位置の番号で行う:
    // 終端が偶数列なら2段先に+3、奇数列なら1段先に+2。
    // 一番端の列でも糸戻しは行う。ただし着地する列の対が別の糸交換で使われている
    // （着地の行範囲で発火した色がある）場合は戻せない。端を越える着地も無し
    // （端の列の交換自体の戻しは端を越えるため書けない）。
    const scheduleReturn = (er, ed) => {
      const step = ed % 2 === 0 ? 2 : 1;
      const rCol = ed + step;
      if (rCol > N - 1 || er + step >= app.rows) return;
      // 着地が一番端の列で、その端の対が着地の行範囲 [er, er+step] で糸交換を
      // 発火しているなら、その対は別の交換で使用中のため戻せない（行範囲は配列境界でクランプ）
      if (rCol === N - 1) {
        const rLo = Math.max(0, er), rHi = Math.min(app.rows - 1, er + step);
        for (let rr = rLo; rr <= rHi; rr++) if (fired[rr][rCol]) return;
      }
      sched[er + step].add(Math.min(rCol + 1, N));
    };
    // 矢印（中央上ル）の後の戻しは反対の面で行う（中央単独=③、d2で終われば⑤）
    if (oppRiseAt(r)) {
      const [er, ed] = trace45(r, 0);
      scheduleReturn(er, ed);
    }
    // 偶数列（縦に進む列）は糸交換のみ: 番号は中央=1からの通し（d+1）。
    // 交換した対は45度（1段ごとに1目外）で進み、色が地色になる所で元に戻す
    // （最後に色が続いた位置の2段先・番号+3。交換の2段先より先になることがある）。
    // 番号は片面の目数（60玉=13、68玉=15）が上限。
    // 45度で続いてきた色（前段の±1目、または1段おきなら2段前の2目内側。中央含む）は
    // 色が変わるところではないので交換しない
    const exchNums = new Set(tipNums[r]);  // 斜めの縞の一番先の糸交換（戻しなし）を含む
    for (let d = 2; d < N; d += 2) {
      if ((app.cells[side][r][d] || 0) > 0) {
        if (!fired[r][d]) continue;  // 糸交換の連なりの続き（carried）は書かない
        exchNums.add(Math.min(d + 1, N));
        const [er, ed] = trace45(r, d);
        scheduleReturn(er, ed);
      }
    }
    // ⬆ は C が唯一の情報源（中央2列の塗りが自動で C を書き込む。記号表は読み取り専用）
    const cj = side === "R" ? 2 * r : 2 * r + 1;
    const hasArrow = (app.cells.C[cj] || 0) > 0;
    let isBridge = false;
    let aya;
    if (!slots.some(Boolean)) {
      aya = "ナミ";
      if (risesAtCenter) {
        // 中央だけで上がる段: 数には入れず、続き扱い（書籍 4-15 のナミ⬆段は②〜nに入らない）
        isBridge = true;
        hadCenter = true;
      } else {
        let pairs = [];
        if (opRun > 0 && hadArrow && !hadCenter) {
          // 手取りの⬆のみのブロック: 書籍 4-15 の一括の戻し（数字は片面の目数が上限）
          for (let p = 2; p <= Math.min(opRun + 2, N); p++) pairs.push(p);
        } else if (opRun > 0) {
          // 上の操作には戻し不要。飛びの糸交換の分だけ戻す
          pairs = [...blockPairs];
        }
        if (r + 1 < app.rows) pairs.forEach(p => sched[r + 1].add(p));
        opRun = 0;
        blockPairs.clear();
        hadCenter = false;
        hadArrow = false;
      }
    } else {
      if (prev && opRun >= 2) {
        // 斜めに色が続く（前段の±1目から移ってきた）目は交換に数えない。
        // 色が変わるところ（斜めから繋がらない新しい目）だけ糸交換
        const added = slots.filter((v, i) =>
          v && !prev[i] && !(i > 0 && prev[i - 1]) && !(i + 1 < prev.length && prev[i + 1])).length;
        if (added >= 2) {
          for (let p = 2; p <= Math.min(opRun, N); p++) {
            exchNums.add(p);
            // 飛びで交換した対は番号+2で戻す（糸交換の2 → ④。片面の目数が上限）
            blockPairs.add(Math.min(p + 2, N));
          }
        }
      }
      aya = ayaName(slots);
      opRun++;
      if (hasArrow) hadArrow = true;
      if (risesAtCenter) hadCenter = true;
    }
    if (hasArrow) aya += "⬆";
    // 糸交換と戻しは1つの数列にまとめて前置（数値順。手書きの綾書の書式）
    texts.push(numberList(sched[r], exchNums, aya.startsWith("ナミ")) + aya);
    if (!isBridge) prev = slots;
  }
  return texts;
}

const notationDiv = document.getElementById("notation");
function renderNotation() {
  const lefts = sideTexts("L");
  const rights = sideTexts("R");
  const rows = [];
  for (let r = 0; r < app.rows; r++) rows.push({ L: lefts[r], R: rights[r] });

  // 段は省略せず1段ずつ表示する
  const groups = rows.map((row, r) => ({ from: r, to: r, L: row.L, R: row.R }));

  const tbl = document.createElement("table");
  tbl.className = "nota";
  tbl.innerHTML = "<tr><th>段</th><th>左半面</th><th>右半面</th></tr>";
  for (const gp of groups) {
    const tr = document.createElement("tr");
    const seg = gp.from === gp.to ? `${gp.from + 1}` : `${gp.from + 1}〜${gp.to + 1}`;
    tr.innerHTML = `<td class="seg">${seg}</td><td>${gp.L}</td><td>${gp.R}</td>`;
    tr.addEventListener("mouseenter", () => highlightRows(gp.from, gp.to, true));
    tr.addEventListener("mouseleave", () => highlightRows(gp.from, gp.to, false));
    tbl.appendChild(tr);
  }
  notationDiv.innerHTML = "";
  notationDiv.appendChild(tbl);
}

function highlightRows(from, to, on) {
  const N = cols();
  for (let r = from; r <= to; r++)
    for (const side of ["L", "R"])
      for (let d = 0; d < N; d++) {
        const p = cellIndex[`${side}-${r}-${d}`];
        if (p) p.classList.toggle("rowHi", on);
      }
}

/* ===== 仕上がりプレビュー ===== */
const previewSvg = document.getElementById("previewSvg");
function renderPreview() {
  const N = cols();
  const S = 5; // プレビューの菱形半径
  const repeats = 2;
  const totalRows = app.rows * repeats;
  const cx = (N + 1) * S + 4;
  const y0 = N * S + 4;
  const w = 2 * ((N + 1) * S) + 8;
  const h = y0 + (totalRows - 1) * 2 * S + S + 4;
  previewSvg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  previewSvg.setAttribute("width", w * 1.4);
  previewSvg.setAttribute("height", h * 1.4);
  previewSvg.innerHTML = "";
  const NS = "http://www.w3.org/2000/svg";
  const frag = document.createDocumentFragment();

  const addDiamond = (x, y, color) => {
    const p = document.createElementNS(NS, "polygon");
    p.setAttribute("points", `${x},${y - S} ${x + S},${y} ${x},${y + S} ${x - S},${y}`);
    p.setAttribute("fill", color);
    p.setAttribute("stroke", shade(color, -18));
    p.setAttribute("stroke-width", "0.3");
    frag.appendChild(p);
  };
  for (let rr = 0; rr < totalRows; rr++) {
    const r = rr % app.rows;
    for (const side of ["L", "R"]) {
      for (let d = 0; d < N; d++) {
        // 右段が先に始まる（グリッドと同じ配置。左半面が1目下がる）
        const x = side === "R" ? cx + d * S : cx - (1 + d) * S;
        const y = y0 + rr * 2 * S - d * S + (side === "L" ? S : 0);
        let color = app.palette[app.cells[side][r][d]] || app.palette[0];
        // 糸の向きによる艶の違いを簡易表現（左右で明度を少し変える）
        if (side === "L") color = shade(color, -6);
        addDiamond(x, y, color);
      }
    }

  }
  previewSvg.appendChild(frag);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = (v) => Math.max(0, Math.min(255, v + amt));
  const r = f(n >> 16), g = f((n >> 8) & 255), b = f(n & 255);
  return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, "0")}`;
}

/* ===== 派生表示の更新（間引き） ===== */
let derivedTimer = null;
function scheduleDerived() {
  clearTimeout(derivedTimer);
  derivedTimer = setTimeout(() => { renderNotation(); renderPreview(); }, 120);
}

/* ===== 保存・読み込み ===== */
function snapshot() {
  return {
    v: 1, name: app.name, tama: app.tama, rows: app.rows,
    palette: app.palette, cells: app.cells,
  };
}
function restore(s) {
  app.tama = TAMA_TO_COLS[s.tama] ? s.tama : 60;
  app.rows = Math.max(4, Math.min(120, s.rows || 40));
  app.palette = Array.isArray(s.palette) && s.palette.length === 4 ? s.palette : app.palette;
  app.name = s.name || "";
  app.cells = resizeCells(s.cells, app.rows, cols());
  syncControls();
  fullRender();
}

let autosaveTimer = null;
function scheduleAutosave() {
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => {
    try { localStorage.setItem(LS_AUTOSAVE, JSON.stringify(snapshot())); } catch (e) {}
  }, 400);
}

function loadDesignList() {
  try { return JSON.parse(localStorage.getItem(LS_DESIGNS) || "{}"); } catch (e) { return {}; }
}
function renderLoadSel() {
  const sel = document.getElementById("loadSel");
  const cur = sel.value;
  sel.innerHTML = '<option value="">保存済みを開く…</option>';
  for (const name of Object.keys(loadDesignList()).sort()) {
    const o = document.createElement("option");
    o.value = name; o.textContent = name;
    sel.appendChild(o);
  }
  sel.value = cur;
}

/* ===== コントロール ===== */
function syncControls() {
  document.getElementById("tamaSel").value = app.tama;
  document.getElementById("rowsInp").value = app.rows;
  document.getElementById("symChk").checked = app.sym;
  document.getElementById("nameInp").value = app.name;
  renderPalette();
}

function fullRender() {
  document.getElementById("printTitle").textContent =
    `綾書 — ${app.tama}玉二枚安田組${app.name ? "「" + app.name + "」" : ""}`;
  renderGrid();
  renderNotation();
  renderPreview();
}

document.getElementById("tamaSel").addEventListener("change", (e) => {
  pushUndo();
  app.tama = +e.target.value;
  app.cells = resizeCells(app.cells, app.rows, cols());
  fullRender(); scheduleAutosave();
});
document.getElementById("rowsInp").addEventListener("change", (e) => {
  const v = Math.max(4, Math.min(120, +e.target.value || 40));
  e.target.value = v;
  pushUndo();
  app.rows = v;
  app.cells = resizeCells(app.cells, app.rows, cols());
  fullRender(); scheduleAutosave();
});
document.getElementById("symChk").addEventListener("change", (e) => { app.sym = e.target.checked; });
document.getElementById("undoBtn").addEventListener("click", () => {
  const s = undoStack.pop();
  if (!s) return;
  app.cells = resizeCells(JSON.parse(s), app.rows, cols());
  repaintAll(); scheduleDerived(); scheduleAutosave();
});
document.getElementById("clearBtn").addEventListener("click", () => {
  if (!confirm("すべてのマスを消去しますか？")) return;
  pushUndo();
  app.cells = emptyCells(app.rows, cols());
  repaintAll(); scheduleDerived(); scheduleAutosave();
});
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "z") {
    e.preventDefault();
    document.getElementById("undoBtn").click();
  }
});

document.getElementById("nameInp").addEventListener("input", (e) => { app.name = e.target.value; });
document.getElementById("saveBtn").addEventListener("click", () => {
  const name = app.name.trim();
  if (!name) { alert("デザイン名を入れてください"); return; }
  const list = loadDesignList();
  list[name] = snapshot();
  try { localStorage.setItem(LS_DESIGNS, JSON.stringify(list)); } catch (e) { alert("保存できませんでした"); return; }
  renderLoadSel();
  document.getElementById("loadSel").value = name;
});
document.getElementById("loadSel").addEventListener("change", (e) => {
  const name = e.target.value;
  if (!name) return;
  const s = loadDesignList()[name];
  if (s) { pushUndo(); restore(s); scheduleAutosave(); }
});
document.getElementById("delBtn").addEventListener("click", () => {
  const sel = document.getElementById("loadSel");
  const name = sel.value;
  if (!name) { alert("削除するデザインを選んでください"); return; }
  if (!confirm(`「${name}」を削除しますか？`)) return;
  const list = loadDesignList();
  delete list[name];
  localStorage.setItem(LS_DESIGNS, JSON.stringify(list));
  renderLoadSel();
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(snapshot(), null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `ayagaki-${(app.name.trim() || "design")}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  file.text().then((txt) => {
    try {
      const s = JSON.parse(txt);
      if (!s.cells) throw new Error();
      pushUndo(); restore(s); scheduleAutosave();
    } catch (err) { alert("読み込めないファイルです"); }
  });
});
document.getElementById("printBtn").addEventListener("click", () => window.print());

/* ===== 起動 ===== */
(function init() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(LS_AUTOSAVE)); } catch (e) {}
  if (saved && saved.cells) {
    restore(saved);
  } else {
    app.cells = emptyCells(app.rows, cols());
    syncControls();
    fullRender();
  }
  renderLoadSel();
})();
</script>
</body>
</html>
